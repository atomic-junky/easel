name: Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.1
  EXPORT_NAME: Easel

jobs:
  export-windows:
    name: Windows Export
    runs-on: ubuntu-24.04
    container:
      image: docker://barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup
        run: |
          mkdir -v -p ~/.config
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/

      - name: Import resources once
        continue-on-error: true
        run: godot --headless -v --import

      - name: Windows Build
        run: |
          mkdir -v -p build/${EXPORT_NAME}-windows-x86_64
          mkdir -v -p build/${EXPORT_NAME}-windows-arm64
          godot --headless -v --export-release "Windows Desktop 64bit" ./build/${EXPORT_NAME}-windows-x86_64/${EXPORT_NAME}.exe
          godot --headless -v --export-release "Windows Desktop arm64" ./build/${EXPORT_NAME}-windows-arm64/${EXPORT_NAME}.exe

      - name: Copy easel_app_data folder
        run: |
          mkdir -p ./easel_app_data
          rm -f ./easel_app_data/.gdignore
          cp -R ./easel_app_data ./build/${EXPORT_NAME}-windows-x86_64/
          cp -R ./easel_app_data ./build/${EXPORT_NAME}-windows-arm64/
          cp -R ./easel_app_data ./build/easel_app_data

      - name: Build installer
        working-directory: ./installer
        run: |
          apt-get update
          apt-get install -y python3 python3-pip nsis
          pip3 install --break-system-packages polib
          python3 ./utils/po2nsi.py -i ./easel-app.nsi -o ./easel-app_loc.nsi -p ./po -l "English" -v
          makensis -DBINNAME=${EXPORT_NAME} easel-app_loc.nsi
          mv *_setup.exe ../build/
          rm -rf ../build/easel_app_data

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ./build/

  linux:
    name: linux
    runs-on: ubuntu-24.04
    container:
      image: docker://barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup
        run: |
          mkdir -v -p ~/.config
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/

      - name: Import resources once
        continue-on-error: true
        run: godot --headless -v --import

      - name: Export
        run: |
          mkdir -v -p build/${EXPORT_NAME}-linux-x86_64
          mkdir -v -p build/${EXPORT_NAME}-linux-arm64
          godot --headless -v --export-release "Linux 64bit" ./build/${EXPORT_NAME}-linux-x86_64/${EXPORT_NAME}.x86_64
          godot --headless -v --export-release "Linux arm64" ./build/${EXPORT_NAME}-linux-arm64/${EXPORT_NAME}.arm64

      - name: Copy easel_app_data folder
        run: |
          rm -f ./easel_app_data/.gdignore
          cp -R ./easel_app_data ./build/${EXPORT_NAME}-linux-x86_64
          cp -R ./easel_app_data ./build/${EXPORT_NAME}-linux-arm64
          chmod +x ./build/${EXPORT_NAME}-linux-x86_64/${EXPORT_NAME}.x86_64
          chmod +x ./build/${EXPORT_NAME}-linux-arm64/${EXPORT_NAME}.arm64

      - name: Create tar.gz archive
        working-directory: ./build
        run: |
          tar zcf ${EXPORT_NAME}-linux-x86_64.tar.gz ${EXPORT_NAME}-linux-x86_64
          tar zcf ${EXPORT_NAME}-linux-arm64.tar.gz ${EXPORT_NAME}-linux-arm64

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: ./build/*.tar.gz

  mac:
    name: mac
    runs-on: ubuntu-24.04
    container:
      image: docker://barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup
        run: |
          mkdir -v -p ~/.config
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/

      - name: Import resources once
        continue-on-error: true
        run: godot --headless -v --import

      - name: Export
        run: |
          mkdir -v -p build
          godot --headless -v --export-release "macOS" ./build/${EXPORT_NAME}-macos-universal.zip

      - name: Bundle easel_app_data
        run: |
          apt-get update
          apt-get install -y zip unzip
          rm -f ./easel_app_data/.gdignore
          mkdir -v -p staging
          unzip -q ./build/${EXPORT_NAME}-macos-universal.zip -d staging
          APP=$(find staging -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP"
          cp -R ./easel_app_data "$APP/Contents/Resources"
          chmod +x "$APP/Contents/MacOS/"*
          rm ./build/${EXPORT_NAME}-macos-universal.zip
          tar -C staging -zcf ./build/${EXPORT_NAME}-macos-universal.tar.gz .

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mac
          path: ./build/*.tar.gz

  android:
    name: android
    runs-on: ubuntu-24.04
    container:
      image: docker://barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 ndk;23.2.8568313'

      - name: Setup
        run: |
          mkdir -v -p ~/.config
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/

      - name: Create debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore ~/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12

      - name: Point Godot at the Android toolchain
        run: |
          test -d "${ANDROID_SDK_ROOT}/build-tools"
          SETTINGS=$(find ~/.config/godot -name 'editor_settings-*.tres' | head -n 1)
          cat >> "$SETTINGS" <<EOF
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import resources once
        continue-on-error: true
        run: godot --headless -v --import

      - name: Export
        run: |
          mkdir -v -p build
          godot --headless -v --install-android-build-template --export-debug "Android" ./build/${EXPORT_NAME}-android.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: ./build/*.apk

  itchio-windows:
    name: 'itchio:windows'
    needs: [windows, linux, mac, android]
    runs-on: ubuntu-24.04
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: windows
          path: dist

      - name: Install butler
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCHIO_TARGET: ${{ vars.ITCHIO_TARGET }}
        run: |
          test -n "$ITCHIO_TARGET"
          for ARCH in x86_64 arm64; do
            ./butler push "dist/${EXPORT_NAME}-windows-${ARCH}" "${ITCHIO_TARGET}:windows-${ARCH}" --userversion "${{ github.ref_name }}"
          done

  itchio-linux:
    name: 'itchio:linux'
    needs: [windows, linux, mac, android]
    runs-on: ubuntu-24.04
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: linux
          path: dist

      - name: Unpack
        run: |
          mkdir -v -p payload
          for ARCH in x86_64 arm64; do
            tar -C payload -zxf "dist/${EXPORT_NAME}-linux-${ARCH}.tar.gz"
          done

      - name: Install butler
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCHIO_TARGET: ${{ vars.ITCHIO_TARGET }}
        run: |
          test -n "$ITCHIO_TARGET"
          for ARCH in x86_64 arm64; do
            ./butler push "payload/${EXPORT_NAME}-linux-${ARCH}" "${ITCHIO_TARGET}:linux-${ARCH}" --userversion "${{ github.ref_name }}"
          done

  itchio-macos:
    name: 'itchio:macos'
    needs: [windows, linux, mac, android]
    runs-on: ubuntu-24.04
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: mac
          path: dist

      - name: Unpack
        run: |
          mkdir -v -p payload
          tar -C payload -zxf "dist/${EXPORT_NAME}-macos-universal.tar.gz"

      - name: Install butler
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCHIO_TARGET: ${{ vars.ITCHIO_TARGET }}
        run: |
          test -n "$ITCHIO_TARGET"
          ./butler push payload "${ITCHIO_TARGET}:macos-universal" --userversion "${{ github.ref_name }}"

  itchio-android:
    name: 'itchio:android'
    needs: [windows, linux, mac, android]
    runs-on: ubuntu-24.04
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: android
          path: dist

      - name: Install butler
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCHIO_TARGET: ${{ vars.ITCHIO_TARGET }}
        run: |
          test -n "$ITCHIO_TARGET"
          ./butler push "dist/${EXPORT_NAME}-android.apk" "$ITCHIO_TARGET:android" --userversion "${{ github.ref_name }}"
