name: Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.1
  EXPORT_NAME: Easel

jobs:
  windows:
    name: Windows Export
    runs-on: ubuntu-24.04
    container:
      image: docker://barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup
        run: |
          mkdir -v -p ~/.config
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/

      - name: Import resources once
        continue-on-error: true
        run: godot --headless -v --import

      - name: Windows Build
        run: |
          mkdir -v -p build/${EXPORT_NAME}-windows-x86_64
          mkdir -v -p build/${EXPORT_NAME}-windows-arm64
          godot --headless -v --export-release "Windows Desktop 64bit" ./build/${EXPORT_NAME}-windows-x86_64/${EXPORT_NAME}.exe
          godot --headless -v --export-release "Windows Desktop arm64" ./build/${EXPORT_NAME}-windows-arm64/${EXPORT_NAME}.exe

      - name: Copy easel_app_data folder
        run: |
          mkdir -p ./easel_app_data
          rm -f ./easel_app_data/.gdignore
          cp -R ./easel_app_data ./build/${EXPORT_NAME}-windows-x86_64/
          cp -R ./easel_app_data ./build/${EXPORT_NAME}-windows-arm64/
          cp -R ./easel_app_data ./build/easel_app_data

      - name: Build installer
        working-directory: ./installer
        run: |
          apt-get update
          apt-get install -y python3 python3-pip nsis
          pip3 install --break-system-packages polib
          python3 ./utils/po2nsi.py -i ./easel-app.nsi -o ./easel-app_loc.nsi -p ./po -l "English" -v
          makensis -DBINNAME=${EXPORT_NAME} easel-app_loc.nsi
          
          mv *-setup.exe ../build/
          rm -rf ../build/easel_app_data
      
      - name: Organize release files
        run: |
          mv ./build/${EXPORT_NAME}-windows-x86_64/${EXPORT_NAME}.exe ./build/${EXPORT_NAME}-windows-x86_64.exe
          mv ./build/${EXPORT_NAME}-windows-arm64/${EXPORT_NAME}.exe ./build/${EXPORT_NAME}-windows-arm64.exe
          
          rm -rf ./build/${EXPORT_NAME}-windows-x86_64
          rm -rf ./build/${EXPORT_NAME}-windows-arm64

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ./build/

  linux:
    name: linux
    runs-on: ubuntu-24.04
    container:
      image: docker://barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup
        run: |
          mkdir -v -p ~/.config
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/

      - name: Import resources once
        continue-on-error: true
        run: godot --headless -v --import

      - name: Export
        run: |
          mkdir -v -p build/${EXPORT_NAME}-linux-x86_64
          mkdir -v -p build/${EXPORT_NAME}-linux-arm64
          godot --headless -v --export-release "Linux 64bit" ./build/${EXPORT_NAME}-linux-x86_64/${EXPORT_NAME}.x86_64
          godot --headless -v --export-release "Linux arm64" ./build/${EXPORT_NAME}-linux-arm64/${EXPORT_NAME}.arm64

      - name: Copy easel_app_data folder
        run: |
          rm -f ./easel_app_data/.gdignore
          cp -R ./easel_app_data ./build/${EXPORT_NAME}-linux-x86_64
          cp -R ./easel_app_data ./build/${EXPORT_NAME}-linux-arm64
          chmod +x ./build/${EXPORT_NAME}-linux-x86_64/${EXPORT_NAME}.x86_64
          chmod +x ./build/${EXPORT_NAME}-linux-arm64/${EXPORT_NAME}.arm64

      - name: Create tar.gz archive
        working-directory: ./build
        run: |
          tar zcf ${EXPORT_NAME}-linux-x86_64.tar.gz ${EXPORT_NAME}-linux-x86_64
          tar zcf ${EXPORT_NAME}-linux-arm64.tar.gz ${EXPORT_NAME}-linux-arm64

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: ./build/*.tar.gz

  mac:
    name: mac
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup export templates
        run: |
          mkdir -v -p "/Users/runner/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          wget https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -a Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv ./templates/* "/Users/runner/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
      
      - name: Download Godot headless binary
        run: |
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip
          unzip -a Godot_v${GODOT_VERSION}-stable_macos.universal.zip
      
      - name: Setup
        run: mkdir -v -p ./build/mac

      - name: Import resources once
        continue-on-error: true
        run: ./Godot.app/Contents/MacOS/Godot --headless -v --import

      - name: Export
        run: |
          chown runner ./Godot.app/Contents/MacOS/Godot
          chmod +x ./Godot.app/Contents/MacOS/Godot
          ./Godot.app/Contents/MacOS/Godot --headless -v --export-release "macOS" ./build/mac/${EXPORT_NAME}.zip
      
      - name: Make application executable
        run: |
          unzip -a ./build/mac/${EXPORT_NAME}.zip -d ./build/mac
          chmod +x ./build/mac/${EXPORT_NAME}.app/Contents/MacOS/${EXPORT_NAME}
          rm ./build/mac/${EXPORT_NAME}.zip

      - name: Fix application icon
        run: sips -s format icns ./build/mac/${EXPORT_NAME}.app/Contents/Resources/icon.icns --out ./build/mac/${EXPORT_NAME}.app/Contents/Resources/icon.icns
      
      - name: Copy easel_app_data folder
        run: |
          cp -R ./easel_app_data ./build/mac/${EXPORT_NAME}.app/Contents/Resources
          rm ./build/mac/${EXPORT_NAME}.app/Contents/Resources/easel_app_data/.gdignore
      
      - name: Ad-hoc signing
        run: codesign -s - --force --deep ./build/mac/${EXPORT_NAME}.app

      - name: Create DMG archive 🔧
        run: hdiutil create -srcfolder ./build/mac -fs HFS+ -volname ${EXPORT_NAME} ./build/mac/${EXPORT_NAME}-mac.dmg

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mac
          path: ./build/mac/*.dmg
  
  android:
    name: android
    runs-on: ubuntu-24.04
    container:
      image: docker://barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 ndk;23.2.8568313'

      - name: Setup
        run: |
          mkdir -v -p ~/.config
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/

      - name: Decode Android Keystores
        env:
          DEBUG_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          RELEASE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$DEBUG_BASE64" | base64 --decode > $HOME/debug.keystore
          
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "$RELEASE_BASE64" | base64 --decode > $HOME/easel-release.keystore
          fi

      - name: Point Godot at the Android toolchain
        run: |
          SETTINGS=$(find ~/.config/godot -name 'editor_settings-*.tres' | head -n 1)
          cat >> "$SETTINGS" <<EOF
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Configure Godot Export Presets (Inject Keystores)
        env:
          RELEASE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
        run: |
          sed -i 's|keystore/debug=".*"|keystore/debug="'"$HOME"'/debug.keystore"|' export_presets.cfg
          sed -i 's|keystore/debug_user=".*"|keystore/debug_user="androiddebugkey"|' export_presets.cfg
          sed -i 's|keystore/debug_password=".*"|keystore/debug_password="android"|' export_presets.cfg
          
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            sed -i 's|keystore/release=".*"|keystore/release="'"$HOME"'/easel-release.keystore"|' export_presets.cfg
            sed -i 's|keystore/release_user=".*"|keystore/release_user="'"$RELEASE_ALIAS"'"|' export_presets.cfg
            sed -i 's|keystore/release_password=".*"|keystore/release_password="'"$RELEASE_PASS"'"|' export_presets.cfg
          fi

      - name: Import resources once
        continue-on-error: true
        run: godot --headless -v --import
      
      - name: Export (Debug)
        if: "! (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))"
        run: |
          mkdir -v -p build
          godot --headless --export-debug "Android" build/${EXPORT_NAME}-android.apk

      - name: Export (Release)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -v -p build
          godot --headless --export-release "Android" build/${EXPORT_NAME}-android.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: ./build/*.apk

  itchio-windows:
    name: 'itchio:windows'
    needs: [windows, linux, mac, android]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: windows
          path: dist

      - name: Install butler
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCHIO_TARGET: ${{ vars.ITCHIO_TARGET }}
        run: |
          test -n "$ITCHIO_TARGET"         
          for ARCH in setup x86_64 arm64; do
            ./butler push "dist/${EXPORT_NAME}-windows-${ARCH}.exe" "${ITCHIO_TARGET}:windows-${ARCH}" --userversion "${{ github.ref_name }}"
          done

  itchio-linux:
    name: 'itchio:linux'
    needs: [windows, linux, mac, android]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: linux
          path: dist

      - name: Unpack
        run: |
          mkdir -v -p payload
          for ARCH in x86_64 arm64; do
            tar -C payload -zxf "dist/${EXPORT_NAME}-linux-${ARCH}.tar.gz"
          done

      - name: Install butler
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCHIO_TARGET: ${{ vars.ITCHIO_TARGET }}
        run: |
          test -n "$ITCHIO_TARGET"
          for ARCH in x86_64 arm64; do
            ./butler push "payload/${EXPORT_NAME}-linux-${ARCH}" "${ITCHIO_TARGET}:linux-${ARCH}" --userversion "${{ github.ref_name }}"
          done

  itchio-macos:
    name: 'itchio:macos'
    needs: [windows, linux, mac, android]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: mac
          path: dist

      - name: Unpack
        run: |
          mkdir -v -p payload
          tar -C payload -zxf "dist/${EXPORT_NAME}-mac.dmg"

      - name: Install butler
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCHIO_TARGET: ${{ vars.ITCHIO_TARGET }}
        run: |
          test -n "$ITCHIO_TARGET"
          ./butler push payload "${ITCHIO_TARGET}:macos-universal" --userversion "${{ github.ref_name }}"

  itchio-android:
    name: 'itchio:android'
    needs: [windows, linux, mac, android]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: android
          path: dist

      - name: Install butler
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCHIO_TARGET: ${{ vars.ITCHIO_TARGET }}
        run: |
          test -n "$ITCHIO_TARGET"
          ./butler push "dist/${EXPORT_NAME}-android.apk" "$ITCHIO_TARGET:android" --userversion "${{ github.ref_name }}"
